    <script>
      (function() {
        // 1. Shim WebSocket for Vite HMR in cloud preview environment
        try {
          const OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              const urlStr = String(url || '');
              const protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
              const isVite = protoStr.includes('vite') || urlStr.includes('vite') || urlStr.includes('token=');
              if (isVite) {
                const target = new EventTarget();
                target.url = urlStr;
                target.readyState = 1;
                target.OPEN = 1;
                target.CONNECTING = 0;
                target.CLOSING = 2;
                target.CLOSED = 3;
                target.protocol = 'vite-hmr';
                target.bufferedAmount = 0;
                target.send = function() {};
                target.close = function(code, reason) {
                  target.readyState = 3;
                  const closeEv = new Event('close');
                  closeEv.wasClean = true;
                  closeEv.code = code || 1000;
                  closeEv.reason = reason || '';
                  if (typeof target.onclose === 'function') target.onclose(closeEv);
                  target.dispatchEvent(closeEv);
                };
                setTimeout(function() {
                  const openEv = new Event('open');
                  if (typeof target.onopen === 'function') target.onopen(openEv);
                  target.dispatchEvent(openEv);
                }, 10);
                return target;
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (_) {}

        // 2. Global console.error filter across all arguments
        const origError = console.error;
        console.error = function(...args) {
          const fullText = args.map(a => (a && (a.message || a.stack || String(a))) || '').join(' ');
          if (
            fullText.includes('WebSocket') ||
            fullText.includes('@vite/client') ||
            fullText.includes('vite-hmr') ||
            fullText.includes('failed to connect to websocket') ||
            fullText.includes('server connection lost')
          ) {
            return;
          }
          origError.apply(console, args);
        };

        // 3. Unhandled promise rejections filter
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('vite-hmr')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // 4. Global window error filter
        window.addEventListener('error', function(event) {
          const msg = event?.message || '';
          const filename = event?.filename || '';
          const errMsg = event?.error ? (event.error.message || event.error.stack || '') : '';
          if (
            msg.includes('WebSocket') ||
            filename.includes('@vite/client') ||
            errMsg.includes('WebSocket')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
